<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="shortcut icon" href="./image/favicon.svg" type="image/x-icon">
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Kirish</h1>
      <p class="sub">Username va parolni kiriting</p>

      <form id="loginForm" autocomplete="off">
        <label class="lbl">Username</label>
        <input id="username" type="text" placeholder="user" required />

        <label class="lbl">Password</label>
        <div class="passbox">
          <input id="password" type="password" placeholder="user" required />
          <button type="button" id="togglePass" class="eye"><i class="fa-solid fa-eye"></i></button>
        </div>

        <button class="btn" type="submit">Kirish</button>
        <div id="msg" class="msg"></div>
      </form>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>

</html>
