<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8" />
    <title>Gift Market Admin · Orders</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
    <div class="app-shell">
        <div class="app-content">
            <header class="header">
                <div class="title-group">
                    <div class="title-row">
                        <div class="title-logo">G</div>
                        <div class="title">
                            <span class="highlight">Gift</span>
                            <span>Market Orders</span>
                        </div>
                    </div>
                    <div class="subtitle">Buyurtmalar · status 1/2/3 · MockAPI</div>
                </div>

                <div class="header-actions">
                    <a class="btn-secondary" href="./products.html">🛒 Mahsulotlar</a>
                    <div class="pill"><span class="pill-dot"></span>LIVE API</div>
                    <button id="btnReloadOrders" class="btn-primary" type="button">🔄 Yangilash</button>
                </div>
            </header>

            <section class="card">
                <div class="orders-top">
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="1" type="button">🆕 Yangi</button>
                        <button class="tab-btn" data-tab="2" type="button">🚚 Jarayonda</button>
                        <button class="tab-btn" data-tab="3" type="button">✅ Yakunlangan</button>
                    </div>
                    <div class="stat-pill" id="ordersInfo">Yuklanmoqda...</div>
                </div>

                <div id="ordersList" class="orders-list"></div>
            </section>

            <div id="mapModal" class="modal hidden">
                <div class="modal-backdrop" data-close="1"></div>
                <div class="modal-card map-card" role="dialog" aria-modal="true">
                    <div class="modal-header">
                        <div class="modal-title">📍 Joylashuv</div>
                        <button class="btn-ghost" id="mapCloseBtn" type="button">✖</button>
                    </div>
                    <div class="modal-body">
                        <div id="leafletMap" class="map-box"></div>
                        <div class="small" id="mapText"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./orders.js"></script>
</body>

</html>
